name: 發佈晨間看板

# 台北沒有日光節約時間。GitHub 常丟掉整點排程，所以改在 :07 與 :37，
# 每 30 分鐘覆蓋早上 05:00–08:00 與傍晚 17:00–20:00。
# 早上（UTC 21:00–00:00）：21:07 21:37 22:07 22:37 23:07 23:37
# 傍晚（UTC 09:00–12:00）：09:07 09:37 10:07 10:37 11:07 11:37
on:
  schedule:
    - cron: "7,37 21-23 * * *"
    - cron: "7,37 9-11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝中文字型與 Chrome
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 測試日曆解析
        run: python -m unittest discover -s tests -v

      - name: 嘗試將 Pages 來源設為 GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null
          fi

      - name: 產生看板
        env:
          GCAL_ICS_URLS: ${{ secrets.GCAL_ICS_URLS }}
          PYTHONUNBUFFERED: "1"
        run: python generate_dashboard.py --html site/index.html --png site/dashboard.png

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
